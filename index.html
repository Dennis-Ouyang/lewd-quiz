<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cut">
<title>淫荡值测试</title>
<meta name="description" content="测出你藏在心底的“小火苗”：多维雷达图版 & 12 题经典版。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>😏</text></svg>">
<style>
  :root {
    --bg: #fff5f8;
    --card: #ffffff;
    --text: #2b1d26;
    --muted: #8a7180;
    --accent: #ff4f8b;
    --accent-2: #a259ff;
    --option: #fff0f5;
    --border: #f6d3e1;
    --shadow: 0 10px 30px rgba(255, 79, 139, .15);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1218;
      --card: #261b23;
      --text: #f6e9f0;
      --muted: #b59aa9;
      --option: #33232e;
      --border: #3f2c39;
      --shadow: 0 10px 30px rgba(0, 0, 0, .4);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    padding: 24px 16px 40px;
    line-height: 1.6;
  }
  .rainbow {
    position: fixed; top: 0; left: 0; right: 0; height: 6px;
    background: linear-gradient(90deg, #e40303, #ff8c00, #ffed00, #008026, #24408e, #732982, #5bcefa, #f5a9b8, #ffffff, #f5a9b8, #5bcefa);
  }
  main { width: 100%; max-width: 520px; }
  .emoji-big { font-size: 64px; text-align: center; line-height: 1.1; margin-top: 8px; }
  h1 {
    font-size: 34px; margin: 4px 0 6px; text-align: center; letter-spacing: 1px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { text-align: center; color: var(--muted); margin: 0 0 22px; }
  .entry {
    display: block; text-decoration: none; color: var(--text);
    background: var(--card); border: 1px solid var(--border); border-radius: 24px;
    padding: 22px; box-shadow: var(--shadow); margin-bottom: 14px;
    transition: transform .1s ease;
    animation: pop .35s ease both;
  }
  .entry:active { transform: scale(.98); }
  .entry.featured { border: 2px solid var(--accent); }
  .entry + .entry { animation-delay: .08s; }
  @keyframes pop { from { opacity: 0; transform: translateY(12px) scale(.98); } to { opacity: 1; transform: none; } }
  .entry-head { display: flex; align-items: center; gap: 12px; }
  .entry-emoji { font-size: 40px; line-height: 1; }
  .entry-title { font-size: 20px; font-weight: 800; }
  .entry-meta { font-size: 13px; color: var(--muted); }
  .entry p { margin: 12px 0 14px; font-size: 15px; }
  .badge {
    display: inline-block; font-size: 12px; font-weight: 700; color: #fff;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    padding: 2px 10px; border-radius: 99px; vertical-align: 3px; margin-left: 4px;
  }
  .go {
    display: block; text-align: center; padding: 13px 18px; border-radius: 999px; font-size: 16px; font-weight: 600;
    color: #fff; background: linear-gradient(90deg, var(--accent), var(--accent-2));
    box-shadow: 0 6px 18px rgba(255, 79, 139, .35);
  }
  .go.ghost { background: transparent; color: var(--accent); box-shadow: none; border: 2px solid var(--accent); }
  .qr-link {
    display: block; width: 100%; margin-top: 4px; background: none; border: 0; cursor: pointer;
    color: var(--muted); font-size: 15px; font-family: inherit; padding: 10px;
  }
  .footer { text-align: center; font-size: 12px; color: var(--muted); margin-top: 10px; }
  .qr-modal {
    position: fixed; inset: 0; background: rgba(0,0,0,.55);
    display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10;
  }
  .hidden { display: none !important; }
  .qr-box { background: #fff; color: #2b1d26; border-radius: 20px; padding: 24px; text-align: center; max-width: 340px; width: 100%; }
  .qr-box #qrcode { display: flex; justify-content: center; margin: 12px 0; }
  .qr-box #qrcode img, .qr-box #qrcode canvas { width: 240px !important; height: 240px !important; }
  .qr-url { font-size: 12px; word-break: break-all; color: #8a7180; }
  .qr-close {
    display: block; width: 100%; border: 0; cursor: pointer; margin-top: 14px;
    padding: 13px 18px; border-radius: 999px; font-size: 16px; font-weight: 600; font-family: inherit;
    color: #fff; background: linear-gradient(90deg, #ff4f8b, #a259ff);
  }
</style>
</head>
<body>
<div class="rainbow" aria-hidden="true"></div>
<main>
  <div class="emoji-big">😏</div>
  <h1>淫荡值测试</h1>
  <p class="sub">测出你藏在心底的“小火苗”，选一个版本开始吧</p>

  <a class="entry featured" href="v2.html">
    <div class="entry-head">
      <div class="entry-emoji">🧪</div>
      <div>
        <div class="entry-title">多维版<span class="badge">NEW</span></div>
        <div class="entry-meta">33 题 · 约 3 分钟 · 6 维雷达图</div>
      </div>
    </div>
    <p>题目改编自心理学研究量表，测你的欲望、油门、刹车、猎奇心……还会检测你有没有在“装”。</p>
    <span class="go">开始多维测试 🔥</span>
  </a>

  <a class="entry" href="classic.html">
    <div class="entry-head">
      <div class="entry-emoji">😏</div>
      <div>
        <div class="entry-title">经典版</div>
        <div class="entry-meta">12 题 · 1 分钟 · 一个总分</div>
      </div>
    </div>
    <p>12 道灵魂拷问，快速测出你的淫荡值，图一乐。</p>
    <span class="go ghost">开始经典测试</span>
  </a>

  <button class="qr-link" id="qrBtn">📱 扫码一起测</button>
  <p class="footer">🔞 纯属娱乐，建议成年人食用</p>
</main>

<div class="qr-modal hidden" id="qrModal">
  <div class="qr-box">
    <b style="font-size:18px">手机扫码，一起来测 👇</b>
    <div id="qrcode"></div>
    <div class="qr-url" id="qrUrl"></div>
    <button class="qr-close" id="qrClose">关闭</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const $ = id => document.getElementById(id);
let qrMade = false;
$("qrBtn").onclick = () => {
  const url = location.href.split("#")[0].replace(/index\.html$/, "");
  $("qrUrl").textContent = url;
  if (!qrMade && window.QRCode) {
    new QRCode($("qrcode"), { text: url, width: 480, height: 480, correctLevel: QRCode.CorrectLevel.M });
    qrMade = true;
  } else if (!window.QRCode) {
    $("qrcode").textContent = "二维码加载失败，请直接分享上面的链接";
  }
  $("qrModal").classList.remove("hidden");
};
$("qrClose").onclick = () => $("qrModal").classList.add("hidden");
$("qrModal").onclick = e => { if (e.target.id === "qrModal") $("qrModal").classList.add("hidden"); };
</script>
</body>
</html>
